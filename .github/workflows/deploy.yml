name: Build deployment image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/backend-mock/**'
      - 'playground/**'
      - 'packages/**'
      - 'internal/**'
      - 'scripts/**'
      - 'pnpm*'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: ancestor-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/carminback/ancestor-admin-vben:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image and export
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/carminback/ancestor-admin-vben:${GITHUB_SHA}"
          docker run -d --name smoke -p 127.0.0.1:18080:80 \
            -e ACCESS_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e REFRESH_TOKEN_SECRET="$(openssl rand -hex 32)" \
            -e ANCESTOR_ADMIN_HASH=test -e ANCESTOR_ADMIN_SALT=test "$image"
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/api/service-config > /tmp/health.json; then break; fi
            sleep 2
          done
          python3 -c "import json; assert json.load(open('/tmp/health.json'))['code']==200"
          curl -fsS http://127.0.0.1:18080/ > /tmp/index.html
          python3 -c "import re,urllib.request; s=open('/tmp/index.html').read(); paths=re.findall(r'src=\"([^\"]+\.js)\"',s); assert paths; [urllib.request.urlopen('http://127.0.0.1:18080'+p).read() for p in paths]"
          docker rm -f smoke
          docker save "$image" | gzip > ancestor-image.tar.gz
          sha256sum ancestor-image.tar.gz > ancestor-image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ancestor-amd64-${{ github.sha }}
          path: |
            ancestor-image.tar.gz
            ancestor-image.tar.gz.sha256
          retention-days: 7
      - name: Publish GHCR
        run: |
          docker push ghcr.io/carminback/ancestor-admin-vben:${GITHUB_SHA}
          docker tag ghcr.io/carminback/ancestor-admin-vben:${GITHUB_SHA} ghcr.io/carminback/ancestor-admin-vben:latest
          docker push ghcr.io/carminback/ancestor-admin-vben:latest

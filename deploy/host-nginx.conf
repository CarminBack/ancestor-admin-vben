server {
  listen 80;
  server_name js.mewinyou.asia;
  location /.well-known/acme-challenge/ { root /var/www/ancestor-acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name js.mewinyou.asia;
  ssl_certificate /etc/letsencrypt/live/js.mewinyou.asia/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/js.mewinyou.asia/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 101M;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }
}

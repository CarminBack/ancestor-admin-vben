version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ancestor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ancestor123456
      MYSQL_DATABASE: ancestor_memorial
      MYSQL_USER: ancestor
      MYSQL_PASSWORD: ancestor123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local

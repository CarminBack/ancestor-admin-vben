version: '3.8'

services:
  ancestor-admin:
    image: ghcr.io/carminback/ancestor-admin-vben:latest
    container_name: ancestor-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./data:/app/backend/data
    networks:
      - ancestor-network

networks:
  ancestor-network:
    driver: bridge
